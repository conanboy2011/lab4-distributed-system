services:
  postgres:
    image: library/postgres:13
    container_name: library_postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    image: chivas1786/gateway:latest
    build: ./gateway
    container_name: gateway_service
    ports:
      - "8080:8080"
    environment:
      - RATING_SERVICE_URL=http://user-service:8050
      - LIBRARY_SERVICE_URL=http://library-service:8060
      - RESERVATION_SERVICE_URL=http://reservation-service:8070
    depends_on:
      - user-service
      - library-service
      - reservation-service

  user-service:
    image: chivas1786/user-service:latest
    build: ./user-service
    container_name: user_service
    ports:
      - "8050:8050"
    environment:
      - DB_URL=postgresql://program:test@postgres:5432/ratings
    depends_on:
      postgres:
        condition: service_healthy

  library-service:
    image: chivas1786/library-service:latest
    build: ./library-service
    container_name: library_service
    ports:
      - "8060:8060"
    environment:
      - DB_URL=postgresql://program:test@postgres:5432/libraries
    depends_on:
      postgres:
        condition: service_healthy

  reservation-service:
    image: chivas1786/reservation-service:latest
    build: ./reservation-service
    container_name: reservation_service
    ports:
      - "8070:8070"
    environment:
      - DB_URL=postgresql://program:test@postgres:5432/reservations
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db-data: